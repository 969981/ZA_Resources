name: ZA native Lua closure ownership and receiver origins

on:
  push:
    branches: [master, 'research/za-lua-closure-receiver-20261105']
    paths:
      - 'scripts/Join-ZA-Lua-Closure-Callers.py'
      - 'scripts/Audit-ZA-Lua-PackCoverage.py'
      - 'tests/test_za_lua_closure_callers.py'
      - 'tests/test_za_lua_pack_coverage.py'
      - '.github/workflows/za-lua-closure-callers.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: za-lua-closure-callers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  owner-join:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/Join-ZA-Lua-Closure-Callers.py
            /scripts/Audit-ZA-Lua-PackCoverage.py
            /scripts/Trace-ZA-Lua-RegisterFlow.py
            /scripts/Analyze-ZA-Lua-DirectCalls.py
            /scripts/_vendor/Analyze-SV-Lua54.py
            /tests/test_za_lua_closure_callers.py
            /tests/test_za_lua_pack_coverage.py
            /tools/PokeDocs-Supplement/ZA/Hashlists/Lua/unresolved-symbol-index.tsv
            /Unpack/v2.0.2/romfs/arc/data.trpfs/_index/lua_pack_locations.json
            /Unpack/v2.0.2/romfs/arc/data.trpfs/_index/pack_index.tsv
            /Unpack/v2.0.2/romfs/arc/data.trpfs/_index/lua-native/native-lua-summary.json
            /Unpack/v2.0.2/romfs/arc/data.trpfs/_index/lua-native/native-c-f-method-edges.tsv
            /Unpack/v2.0.2/romfs/arc/data.trpfs/_index/lua-native/native-c-s-static-edges.tsv
            /Unpack/v2.0.2/romfs/arc/data.trpfs/_index/lua-native/native-unknown-register-flow-calls.tsv
            /Unpack/v2.0.2/romfs/arc/data.trpfs/_index/lua-native/native-unknown-constants.tsv
            /Unpack/v2.0.2/romfs/arc/data.trpfs/_index/lua-native/native-haxe-crosswalk.tsv
            /Unpack/v2.0.2/romfs/arc/data.trpfs/virtual/script/lua/bin/release/**

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify deterministic synthetic ownership and scope tests
        run: |
          python -m unittest discover -s tests -p test_za_lua_closure_callers.py -v
          python -m unittest discover -s tests -p test_za_lua_pack_coverage.py -v

      - name: Join native prototype closures and CALL instructions
        run: python scripts/Join-ZA-Lua-Closure-Callers.py --window 16

      - name: Audit complete v2.0.2 Trinity Lua pack scope
        run: python scripts/Audit-ZA-Lua-PackCoverage.py

      - uses: actions/upload-artifact@v4
        with:
          name: ZA-v2.0.2-Lua-closure-ownership-${{ github.run_number }}
          retention-days: 30
          path: |
            Unpack/v2.0.2/romfs/arc/data.trpfs/_index/lua-native/native-closure-caller-receiver.tsv
            Unpack/v2.0.2/romfs/arc/data.trpfs/_index/lua-native/native-closure-caller-receiver-summary.json
            Unpack/v2.0.2/romfs/arc/data.trpfs/_index/lua-native/native-lua-pack-coverage.json

      - name: Publish verified derived data on master only
        if: github.ref == 'refs/heads/master'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse -f -- \
            Unpack/v2.0.2/romfs/arc/data.trpfs/_index/lua-native/native-closure-caller-receiver.tsv \
            Unpack/v2.0.2/romfs/arc/data.trpfs/_index/lua-native/native-closure-caller-receiver-summary.json \
            Unpack/v2.0.2/romfs/arc/data.trpfs/_index/lua-native/native-lua-pack-coverage.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'analysis(za): publish native Lua caller ownership and receiver origins'
          git fetch origin master
          git rebase origin/master
          git push origin HEAD:master
