            /Unpack/v2.0.2/romfs/arc/data.trpfs/virtual/ik_pokemon/data/pm0770/*/*.trmtr
            /Unpack/v2.0.2/romfs/arc/data.trpfs/virtual/ik_pokemon/data/pm0770/*/*.bntx
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.2.6 Pillow==12.3.0
      - run: python scripts/ZANativeModelExporterV21.py --self-test
      - run: python scripts/ZANativeModelExporterV21.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Khronos batch validator
        run: |
          npm install --no-save --ignore-scripts gltf-validator@2.0.0-dev.3.10
          node scripts/Validate-ZABatchGltf.cjs .za-work/ZANativeModelExporterV21
      - name: Install Blender and system NumPy
        run: sudo apt-get update -qq && sudo apt-get install -y blender python3-numpy
      - run: blender -b --python-exit-code 1 --python-expr 'import numpy; print(numpy.__version__)'
      - name: Render candidate GLBs
        run: blender -b -t 2 --python-exit-code 1 --python scripts/Validate-ZABatchBlender.py -- .za-work/ZANativeModelExporterV21
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ZANativeModelExporterV21-Metadata
          include-hidden-files: true
          path: |
            .za-work/ZANativeModelExporterV21/summary.json
            .za-work/ZANativeModelExporterV21/batch-results.jsonl
            .za-work/ZANativeModelExporterV21/khronos-summary.json
            .za-work/ZANativeModelExporterV21/blender-summary.json
            .za-work/ZANativeModelExporterV21/models/**/summary.json
            .za-work/ZANativeModelExporterV21/models/**/source-mips.jsonl
          if-no-files-found: warn
