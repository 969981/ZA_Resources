name: ZA V2.1 representative batch and visual validation
on:
  push:
    branches: [research/za-complete-resource-catalog]
    paths:
      - scripts/ZANativeModelExporterV21.py
      - scripts/Validate-ZABatchGltf.cjs
      - scripts/Validate-ZABatchBlender.py
      - .github/workflows/za-native-model-exporter-v21.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  representative:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/ZANativeModelExporterV21.py
            /scripts/ZANativeModelExporterV2.py
            /scripts/ZANativeModelExporter.py
            /scripts/Audit-ZAGeometrySkin.py
            /scripts/Audit-ZANativePokemonModels.py
            /scripts/Probe-ZA-PokemonConfig.py
            /scripts/Decode-ZA-BNTX.py
            /scripts/Validate-ZABatchGltf.cjs
            /scripts/Validate-ZABatchBlender.py
            /Unpack/v2.0.2/romfs/arc/data.trpfs/virtual/avalon/data/personal_array.bin
            /Unpack/v2.0.2/romfs/arc/data.trpfs/virtual/ik_pokemon/catalog/catalog/poke_resource_table.trpmcatalog
            /Unpack/v2.0.2/romfs/arc/data.trpfs/virtual/ik_pokemon/data/pm0001/*/*.trmdl
            /Unpack/v2.0.2/romfs/arc/data.trpfs/virtual/ik_pokemon/data/pm0001/*/*.trmsh
            /Unpack/v2.0.2/romfs/arc/data.trpfs/virtual/ik_pokemon/data/pm0001/*/*.trmbf
            /Unpack/v2.0.2/romfs/arc/data.trpfs/virtual/ik_pokemon/data/pm0001/*/*.trskl
            /Unpack/v2.0.2/romfs/arc/data.trpfs/virtual/ik_pokemon/data/pm0001/*/*.trmmt
            /Unpack/v2.0.2/romfs/arc/data.trpfs/virtual/ik_pokemon/data/pm0001/*/*.trmtr
            /Unpack/v2.0.2/romfs/arc/data.trpfs/virtual/ik_pokemon/data/pm0001/*/*.bntx
            /Unpack/v2.0.2/romfs/arc/data.trpfs/virtual/ik_pokemon/data/pm0003/*/*.trmdl
            /Unpack/v2.0.2/romfs/arc/data.trpfs/virtual/ik_pokemon/data/pm0003/*/*.trmsh
            /Unpack/v2.0.2/romfs/arc/data.trpfs/virtual/ik_pokemon/data/pm0003/*/*.trmbf
            /Unpack/v2.0.2/romfs/arc/data.trpfs/virtual/ik_pokemon/data/pm0003/*/*.trskl
            /Unpack/v2.0.2/romfs/arc/data.trpfs/virtual/ik_pokemon/data/pm0003/*/*.trmmt
