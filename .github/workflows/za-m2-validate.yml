name: Validate ZA Trinity full batch publisher
on:
  push:
    branches: [master]
    paths:
      - scripts/Run-ZA-FullExtract.py
      - tests/test_za_full_extract.py
      - .github/workflows/za-m2-validate.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  no-rom-pipeline-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            scripts
            tests
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check syntax, path security and isolated-index publication
        run: |
          python -m py_compile scripts/Run-ZA-FullExtract.py
          python -m unittest discover -s tests -p 'test_za_full_extract.py' -v
