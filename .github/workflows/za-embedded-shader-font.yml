name: ZA embedded shader and native font methods
on:
  push:
    branches: [research/za-ui-arc-resource-pack-20261126]
    paths:
      - scripts/Probe-ZA-EmbeddedShaderFont.py
      - .github/workflows/za-embedded-shader-font.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/Probe-ZA-EmbeddedShaderFont.py
            /scripts/Probe-ZA-Lua-Host-ELF.py
            /Unpack/v2.0.2/exefs/main/main.elf
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install capstone==5.0.7
      - run: python scripts/Probe-ZA-EmbeddedShaderFont.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ZAEmbeddedShaderFontEvidence
          path: .za-work/native-font-shader/
          include-hidden-files: true
