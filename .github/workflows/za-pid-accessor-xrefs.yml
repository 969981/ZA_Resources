name: ZA 2.0.2 PID accessor native callsite research
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'scripts/Trace-ZA-PID-Accessor-Callers.py'
      - 'tests/test_za_pid_accessor_callers.py'
      - '.github/workflows/za-pid-accessor-xrefs.yml'
permissions:
  contents: write
concurrency:
  group: za-pid-accessor-${{ github.ref }}
  cancel-in-progress: false
jobs:
  pid-native-xrefs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/Trace-ZA-PID-Accessor-Callers.py
            /tests/test_za_pid_accessor_callers.py
            /Unpack/v2.0.2/exefs/main/main.elf
            /Unpack/v2.0.2/exefs/exefs-manifest.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synthetic ELF branch and grouping tests
        run: python -m unittest discover -s tests -p test_za_pid_accessor_callers.py -v
      - name: Verify pinned ELF and extract PID getter/setter xrefs
        run: python scripts/Trace-ZA-PID-Accessor-Callers.py --span 0x800 --limit 70
      - name: Upload reproducible JSON
        uses: actions/upload-artifact@v4
        with:
          name: za-v2.0.2-pid-native-xrefs-${{ github.run_number }}
          retention-days: 30
          path: docs/research/v2.0.2/za-pid-accessor-callsite-xrefs.json
      - name: Commit small derived report to master
        if: github.ref == 'refs/heads/master'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse -f -- docs/research/v2.0.2/za-pid-accessor-callsite-xrefs.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'analysis(za): publish pinned PID accessor direct callsite xrefs'
          git fetch origin master
          git rebase origin/master
          git push origin HEAD:master
