name: ZA texture binding audit
on:
  push:
    branches: [research/za-image-resource-audit-20261126]
    paths:
      - scripts/Probe-ZA-TextureBinding.py
      - .github/workflows/za-texture-binding.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/Probe-ZA-TextureBinding.py
            /scripts/Probe-ZA-Lua-Host-ELF.py
            /Unpack/v2.0.2/exefs/main/main.elf
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install capstone==5.0.3
      - run: python scripts/Probe-ZA-TextureBinding.py
      - uses: actions/upload-artifact@v4
        with:
          name: ZATextureBinding
          path: .za-work/texture-binding/
          include-hidden-files: true
          if-no-files-found: error
