name: ZA complete resource catalog
on:
  push:
    branches: [research/za-complete-resource-catalog]
    paths:
      - scripts/Build-ZACompleteResourceCatalog.py
      - .github/workflows/za-complete-resource-catalog.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/Build-ZACompleteResourceCatalog.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synthetic classification and database tests
        run: python scripts/Build-ZACompleteResourceCatalog.py --self-test
      - name: Full native virtual path census
        run: python scripts/Build-ZACompleteResourceCatalog.py
      - uses: actions/upload-artifact@v4
        with:
          name: ZACompleteResourceCatalog-Metadata
          include-hidden-files: true
          path: |
            .za-work/ZACompleteResources/summary.json
            .za-work/ZACompleteResources/category-summary.csv
            .za-work/ZACompleteResources/inventory.csv
            .za-work/ZACompleteResources/ZAResourceDatabase/*.sqlite
          if-no-files-found: error
