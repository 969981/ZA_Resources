name: ZA v2.0.2 Rare ARM64 static evidence

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'scripts/Scan-ZA-Rare-ARM64.py'
      - 'scripts/Scan-ZA-Rare-Descriptor-Offset68.py'
      - 'tests/test_za_rare_descriptor_offset68.py'
      - 'scripts/Trace-ZA-Rare-Candidates.py'
      - 'scripts/Trace-ZA-EX-Spawner.py'
      - 'tests/test_za_ex_spawner.py'
      - 'tests/test_za_rare_arm64.py'
      - '.github/workflows/za-rare-arm64-static.yml'

permissions:
  contents: write

concurrency:
  group: za-rare-arm64-static-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rare-arm64-static:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/Scan-ZA-Rare-ARM64.py
            /scripts/Scan-ZA-Rare-Descriptor-Offset68.py
            /tests/test_za_rare_descriptor_offset68.py
            /scripts/Trace-ZA-Rare-Candidates.py
            /scripts/Trace-ZA-EX-Spawner.py
            /tests/test_za_ex_spawner.py
            /tests/test_za_rare_arm64.py
            /Unpack/v2.0.2/exefs/main/main.elf
            /Unpack/v2.0.2/romfs/arc/data.trpfs/virtual/world/ik_data/field/pokemon_spawner/pokemon_spawner_data/pokemon_spawner_data_array.bin
            /Unpack/v2.0.2/exefs/exefs-manifest.json
            /docs/research/v2.0.2/za-pid-accessor-callsite-xrefs.json
            /Unpack/v2.0.2/romfs/arc/data.trpfs/virtual/ik_event/bin/event_wild_battle_data/wild_btl_data_global.bin
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test synthetic ARM64 and FlatBuffers decoders
        run: python -m unittest discover -s tests -p test_za_rare_arm64.py -v
      - name: Test native +0x68 field references synthetic ELF
        run: python -m unittest discover -s tests -p test_za_rare_descriptor_offset68.py -v
      - name: Audit possible native Rare descriptor producers and consumers
        run: python scripts/Scan-ZA-Rare-Descriptor-Offset68.py
      - name: Test synthetic EX spawner-to-encounter crosswalk
        run: python -m unittest discover -s tests -p test_za_ex_spawner.py -v
      - name: Crosswalk native battle actor and encounter IDs
        run: python scripts/Trace-ZA-EX-Spawner.py
      - name: Scan SHA-pinned Z-A v2.0.2 main.elf and battle source
        run: python scripts/Scan-ZA-Rare-ARM64.py --limit 60
      - name: Decode exact-mask instruction neighborhoods (static only)
        run: |
          python -m pip install 'capstone==5.0.6'
          python scripts/Trace-ZA-Rare-Candidates.py
          python scripts/Trace-ZA-Rare-Candidates.py --site-kind anti-shiny-xor --output docs/research/v2.0.2/za-rare-arm64-anti-shiny-xor-sites.md --before 0xC0 --after 0xC0
          python scripts/Trace-ZA-Rare-Candidates.py --site-kind pid-shiny-callers --output docs/research/v2.0.2/za-pid-antishiny-caller-contexts.md --before 0x280 --after 0x120
          python scripts/Trace-ZA-Rare-Candidates.py --site-kind native-state-builder-callers --output docs/research/v2.0.2/za-native-rare-builder-callers.md --before 0x200 --after 0x80
      - name: Upload candidate report for manual review
        uses: actions/upload-artifact@v4
        with:
          name: za-v2.0.2-rare-arm64-static-${{ github.run_number }}
          retention-days: 30
          path: |
            docs/research/v2.0.2/za-rare-arm64-static-candidates.json
            docs/research/v2.0.2/za-rare-arm64-exact-sites.md
            docs/research/v2.0.2/za-rare-arm64-anti-shiny-xor-sites.md
            docs/research/v2.0.2/za-pid-antishiny-caller-contexts.md
            docs/research/v2.0.2/za-native-rare-builder-callers.md
            docs/research/v2.0.2/za-rare-descriptor-offset68-xrefs.json
            docs/research/v2.0.2/za-ex1-ex2-spawner-crosswalk.json
      - name: Commit bounded static evidence report, no game binary
        if: github.ref == 'refs/heads/master'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse -f -- docs/research/v2.0.2/za-rare-arm64-static-candidates.json docs/research/v2.0.2/za-rare-arm64-exact-sites.md docs/research/v2.0.2/za-rare-arm64-anti-shiny-xor-sites.md docs/research/v2.0.2/za-pid-antishiny-caller-contexts.md docs/research/v2.0.2/za-native-rare-builder-callers.md docs/research/v2.0.2/za-rare-descriptor-offset68-xrefs.json docs/research/v2.0.2/za-ex1-ex2-spawner-crosswalk.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'analysis(za): publish v2.0.2 Rare AArch64 static candidates'
          git fetch origin master
          git rebase origin/master
          git push origin HEAD:master
