name: ZA glyph UV and native UI RTTI audit
on:
  push:
    branches: [research/za-ui-arc-resource-pack-20261126]
    paths:
      - scripts/Audit-ZA-NativeGlyphUV.py
      - scripts/Probe-ZA-NativeUIRTTI.py
      - .github/workflows/za-glyph-uv-native-rtti.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/Audit-ZA-NativeGlyphUV.py
            /scripts/Probe-ZA-NativeUIRTTI.py
            /scripts/Audit-ZA-FontShader.py
            /scripts/Build-ZAImageResources.py
            /scripts/Decode-ZA-BNTX.py
            /scripts/Probe-ZA-Lua-Host-ELF.py
            /Unpack/v2.0.2/romfs/arc/data.trpfs/virtual/ui/font/bin/
            /Unpack/v2.0.2/exefs/main/main.elf
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==12.3.0 capstone==5.0.7
      - run: python scripts/Audit-ZA-NativeGlyphUV.py
      - run: python scripts/Probe-ZA-NativeUIRTTI.py
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ZAGlyphUVNativeRTTIMetadata
          path: |
            .za-work/glyph-uv/
            .za-work/ui-rtti/
          include-hidden-files: true
