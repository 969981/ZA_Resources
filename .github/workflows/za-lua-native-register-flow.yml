name: ZA native Lua straight-line register dataflow

on:
  push:
    branches: [master, 'research/za-lua-register-flow-20261105']
    paths:
      - 'scripts/Trace-ZA-Lua-RegisterFlow.py'
      - 'tests/test_za_lua_register_flow.py'
      - '.github/workflows/za-lua-native-register-flow.yml'
      - 'Unpack/v2.0.2/romfs/arc/data.trpfs/_index/lua-native/native-lua-summary.json'
      - 'Unpack/v2.0.2/romfs/arc/data.trpfs/_index/lua-native/native-unknown-direct-call-edges.tsv'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: za-native-register-flow-${{ github.ref }}
  cancel-in-progress: false

jobs:
  register-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/Trace-ZA-Lua-RegisterFlow.py
            /scripts/Analyze-ZA-Lua-DirectCalls.py
            /scripts/_vendor/Analyze-SV-Lua54.py
            /tests/test_za_lua_register_flow.py
            /tools/PokeDocs-Supplement/ZA/Hashlists/Lua/unresolved-symbol-index.tsv
            /Unpack/v2.0.2/romfs/arc/data.trpfs/virtual/script/lua/bin/release/**
            /Unpack/v2.0.2/romfs/arc/data.trpfs/_index/lua-native/native-lua-summary.json
            /Unpack/v2.0.2/romfs/arc/data.trpfs/_index/lua-native/native-unknown-direct-call-edges.tsv
            /Unpack/v2.0.2/romfs/arc/data.trpfs/_index/lua_pack_locations.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test conservative Lua 5.4 tracing with synthetic instructions
        run: python -m unittest discover -s tests -p test_za_lua_register_flow.py -v

      - name: Analyze pinned native Lua files
        run: python scripts/Trace-ZA-Lua-RegisterFlow.py --max-window 16

      - uses: actions/upload-artifact@v4
        with:
          name: ZA-v2.0.2-native-Lua-register-flow-${{ github.run_number }}
          path: |
            Unpack/v2.0.2/romfs/arc/data.trpfs/_index/lua-native/native-unknown-register-flow-calls.tsv
            Unpack/v2.0.2/romfs/arc/data.trpfs/_index/lua-native/native-unknown-register-key-uses.tsv
            Unpack/v2.0.2/romfs/arc/data.trpfs/_index/lua-native/native-unknown-register-flow-summary.json
          retention-days: 30

      - name: Publish derived evidence when merged to master
        if: github.ref == 'refs/heads/master'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse -f -- \
            Unpack/v2.0.2/romfs/arc/data.trpfs/_index/lua-native/native-unknown-register-flow-calls.tsv \
            Unpack/v2.0.2/romfs/arc/data.trpfs/_index/lua-native/native-unknown-register-key-uses.tsv \
            Unpack/v2.0.2/romfs/arc/data.trpfs/_index/lua-native/native-unknown-register-flow-summary.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'analysis(za): publish conservative native Lua register-flow evidence'
          git fetch origin master
          git rebase origin/master
          git push origin HEAD:master
