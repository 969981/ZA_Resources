name: ZA native shader core and transparent material audit
on:
  push:
    branches: [research/za-complete-resource-catalog]
    paths:
      - scripts/ZANativeShaderCore.py
      - scripts/ZATransparentMaterialV25.py
      - scripts/Audit-ZATransparentMaterials.py
      - .github/workflows/za-native-shader-core.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shader-core:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /Unpack/v2.0.2/romfs/arc/data.trpfs/virtual/system_resource/gfx2/shader/
            /Unpack/v2.0.2/romfs/arc/data.trpfs/virtual/ik_pokemon/data/*/*/*.trmtr
            /Unpack/v2.0.2/romfs/arc/data.trpfs/virtual/ik_pokemon/data/pm0770/*/*.bntx
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.2.6 Pillow==12.3.0
      - run: python scripts/ZANativeShaderCore.py
      - run: python scripts/Audit-ZATransparentMaterials.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ZANativeShaderCore-Metadata
          include-hidden-files: true
          path: .za-work/ZANativeShaderCore/
          if-no-files-found: warn
