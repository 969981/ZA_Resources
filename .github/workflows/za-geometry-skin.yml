name: ZA geometry skin and LayerMask audit
on:
  push:
    branches: [research/za-complete-resource-catalog]
    paths:
      - scripts/Audit-ZAGeometrySkin.py
      - .github/workflows/za-geometry-skin.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/Audit-ZAGeometrySkin.py
            /scripts/Audit-ZANativePokemonModels.py
            /scripts/Probe-ZA-PokemonConfig.py
            /Unpack/v2.0.2/romfs/arc/data.trpfs/virtual/ik_pokemon/data/**/*.trmdl
            /Unpack/v2.0.2/romfs/arc/data.trpfs/virtual/ik_pokemon/data/**/*.trmsh
            /Unpack/v2.0.2/romfs/arc/data.trpfs/virtual/ik_pokemon/data/**/*.trmbf
            /Unpack/v2.0.2/romfs/arc/data.trpfs/virtual/ik_pokemon/data/**/*.trskl
            /Unpack/v2.0.2/romfs/arc/data.trpfs/virtual/ik_pokemon/data/**/*.trmtr
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/Audit-ZAGeometrySkin.py --self-test
      - run: python scripts/Audit-ZAGeometrySkin.py
      - uses: actions/upload-artifact@v4
        with:
          name: ZAGeometrySkinAudit-Metadata
          include-hidden-files: true
          path: .za-work/ZAGeometrySkinAudit/
          if-no-files-found: error
