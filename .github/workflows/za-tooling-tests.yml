name: ZA toolchain synthetic checks
on:
  push:
    paths:
      - "scripts/Build-ZA-GFPAKHashCache.py"
      - "scripts/Convert-ZA-ExeFS.py"
      - "scripts/Sync-ZA-Tools.ps1"
      - "tools/ZA.TrinityDump/**"
      - "tools/upstream.json"
      - "tests/test_za_tooling.py"
      - ".github/workflows/za-tooling-tests.yml"
  pull_request:
    paths:
      - "scripts/Build-ZA-GFPAKHashCache.py"
      - "scripts/Convert-ZA-ExeFS.py"
      - "scripts/Sync-ZA-Tools.ps1"
      - "tools/ZA.TrinityDump/**"
      - "tools/upstream.json"
      - "tests/test_za_tooling.py"
      - ".github/workflows/za-tooling-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python-synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            scripts
            tests
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests without game data
        run: python -m unittest discover -s tests -p "test_za_tooling.py" -v
  dotnet-vendor-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            tools/ZA.TrinityDump
            tools/gftool
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Compile ZA.TrinityDump using committed GFTool.Core
        run: dotnet build tools/ZA.TrinityDump/ZA.TrinityDump.csproj -c Release
