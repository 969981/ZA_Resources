name: ZA UI ARC and image pack audit
on:
  push:
    branches: [research/za-ui-arc-resource-pack-20261126]
    paths:
      - scripts/Build-ZAImageResources.py
      - .github/workflows/za-ui-arc-image-pack.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/Build-ZAImageResources.py
            /scripts/Decode-ZA-BNTX.py
            /Unpack/v2.0.2/romfs/arc/data.trpfs/virtual/ui/data/
            /Unpack/v2.0.2/romfs/arc/data.trpfs/virtual/ui/tex/
            /Unpack/v2.0.2/romfs/arc/data.trpfs/virtual/ik_pokemon/data/**/icon/*.bntx
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==12.3.0
      - name: Synthetic SARC and channel reconstruction tests
        run: python scripts/Build-ZAImageResources.py --self-test
      - name: Audit ARC and BNTX, no source image publication
        run: python scripts/Build-ZAImageResources.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ZAImageResourcesMetadata
          include-hidden-files: true
          path: |
            .za-work/ZAImageResources/manifests/
            .za-work/ZAImageResources/database/images.sqlite
          if-no-files-found: error
