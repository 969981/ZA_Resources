name: ZA resource key scanner
on:
  push:
    branches: [research/za-image-resource-audit-20261126]
    paths:
      - scripts/Scan-ZA-ResourceKeys.py
      - .github/workflows/za-resource-key-scanner.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/Scan-ZA-ResourceKeys.py
            /scripts/Probe-ZA-Lua-Host-ELF.py
            /Unpack/v2.0.2/exefs/main/main.elf
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install capstone==5.0.3
      - run: python scripts/Scan-ZA-ResourceKeys.py
      - uses: actions/upload-artifact@v4
        with:
          name: ZAResourceKeys
          path: .za-work/resource-keys/
          include-hidden-files: true
          if-no-files-found: error
